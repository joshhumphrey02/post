# TryPost — self-hosted production stack.
#
# Every value is read from the environment (Coolify's Environment Variables tab,
# or a .env file next to this compose file). Variables written as ${VAR:?...}
# are required and the stack refuses to start without them; ${VAR:-default}
# falls back to the default shown.
#
#   1. Generate an app key:   echo "base64:$(openssl rand -base64 32)"
#      Set it as APP_KEY.
#   2. Set APP_URL, DB_URL, REDIS_URL and REVERB_APP_SECRET.
#   3. Start:                 docker compose -f compose.prod.yaml up -d
#
# This pulls the published image — no local build. PostgreSQL and Redis are
# external (Coolify-managed databases); the app must share their Docker
# network. The queue workers, the scheduler and the WebSocket server run in
# the app.

services:
  app:
    image: ghcr.io/trypostit/trypost:latest
    restart: unless-stopped
    # The published image's entrypoint waits for Postgres with
    # `pg_isready -h $DB_HOST ...` and ignores DB_URL, so it would block on the
    # default host "pgsql". Derive the split DB_* vars from DB_URL first, then
    # hand off to the stock entrypoint. ($$ escapes $ from compose.)
    entrypoint:
      - /bin/sh
      - -c
      - |
        eval "$$(php -r '$$u = parse_url((string) getenv("DB_URL")); foreach (["DB_HOST" => $$u["host"] ?? "", "DB_PORT" => $$u["port"] ?? 5432, "DB_USERNAME" => $$u["user"] ?? "postgres", "DB_DATABASE" => ltrim($$u["path"] ?? "/postgres", "/")] as $$k => $$v) { echo "export {$$k}=".escapeshellarg((string) $$v)."\n"; }')"
        exec /usr/local/bin/entrypoint.sh
    environment:
      # ===== Required =====
      APP_NAME: ${APP_NAME:-TryPost}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY is required - run php artisan key:generate --show}
      APP_URL: ${APP_URL:?APP_URL is required, e.g. https://post.yourdomain.com}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      TRYPOST_TARGET: ${TRYPOST_TARGET:-production}

      # ===== Database (external Coolify PostgreSQL) =====
      # Coolify's "Postgres URL (internal)", e.g. postgres://user:pass@host:5432/db
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_URL: ${DB_URL:?DB_URL is required}

      # ===== Redis / queue / cache / broadcasting (external Coolify Redis) =====
      # Coolify's "Redis URL (internal)" WITHOUT the trailing /0, e.g.
      # redis://default:pass@host:6379 — a path pins every Redis connection to
      # one database, so a cache clear would also wipe the queue.
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}

      # ===== WebSockets (Reverb) =====
      # REVERB_HOST/PORT/SCHEME are how the app itself reaches Reverb inside
      # the container — keep them on localhost:8080. The published image bakes
      # the browser side at localhost:8080, so live updates need a custom build.
      REVERB_APP_ID: ${REVERB_APP_ID:-1001}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-trypost-reverb-key}   # must match the key baked into the published image
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
      REVERB_HOST: ${REVERB_HOST:-localhost}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}

      # ===== Passport (OAuth / API keys / MCP) =====
      # REQUIRED for any durable deploy (and always for multi-node / load
      # balancers). File keys under storage/ are NOT persisted by the volumes
      # below — without these env vars a container recreate issues new keys and
      # invalidates every API/MCP token. Generate once:
      #   docker compose -f compose.prod.yaml run --rm app php artisan passport:keys --show
      PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY:-}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY:-}

      # ===== Storage =====
      # Default: local disk, persisted in the "storage" volume below.
      # Set FILESYSTEM_DISK=r2 or s3 and fill the matching block to use a bucket.
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_URL: ${R2_URL:-}                   # public bucket URL (needed for media to display)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_URL: ${AWS_URL:-}

      # ===== Mail =====
      # Defaults to "log" (emails written to the container log). Set
      # MAIL_MAILER=smtp and the SMTP values for real emails.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TryPost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}

      # ===== Social platforms (fill in when you connect each network) =====
      # Redirect URI in each portal: ${APP_URL}/accounts/<platform>/callback
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}           # YouTube + Google login
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # OAuth callbacks — config/services.php has no fallback, so an unset one
      # sends an empty redirect_uri. Derived from APP_URL; register the same
      # URLs in each developer portal.
      LINKEDIN_CLIENT_REDIRECT: ${LINKEDIN_CLIENT_REDIRECT:-${APP_URL}/accounts/linkedin/callback}
      X_CLIENT_REDIRECT: ${X_CLIENT_REDIRECT:-${APP_URL}/accounts/x/callback}
      FACEBOOK_CLIENT_REDIRECT: ${FACEBOOK_CLIENT_REDIRECT:-${APP_URL}/accounts/facebook/callback}
      INSTAGRAM_CLIENT_REDIRECT: ${INSTAGRAM_CLIENT_REDIRECT:-${APP_URL}/accounts/instagram/callback}
      THREADS_CLIENT_REDIRECT: ${THREADS_CLIENT_REDIRECT:-${APP_URL}/accounts/threads/callback}
      TIKTOK_CLIENT_REDIRECT: ${TIKTOK_CLIENT_REDIRECT:-${APP_URL}/accounts/tiktok/callback}
      PINTEREST_CLIENT_REDIRECT: ${PINTEREST_CLIENT_REDIRECT:-${APP_URL}/accounts/pinterest/callback}
      GOOGLE_CLIENT_REDIRECT: ${GOOGLE_CLIENT_REDIRECT:-${APP_URL}/accounts/youtube/callback}
      GOOGLE_AUTH_CALLBACK: ${GOOGLE_AUTH_CALLBACK:-${APP_URL}/auth/google/callback}

      # ===== AI (optional — leave blank to disable AI features) =====
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    # No host ports: Coolify's proxy reaches nginx over the internal network.
    # Set the app's domain in Coolify as https://<APP_DOMAIN>:80 — nginx serves
    # both the app and the WebSocket (/app/). Outside Coolify, replace with
    # ports: ["8000:80"].
    expose:
      - "80"
    volumes:
      - storage:/var/www/html/storage/app
    # "coolify" is where Coolify-managed Postgres/Redis live, so the hosts in
    # DB_URL / REDIS_URL resolve from here.
    networks:
      - default
      - coolify
    # The app sits on two networks; tell Coolify's Traefik which one it shares.
    labels:
      - traefik.docker.network=${COOLIFY_NETWORK:-coolify}

networks:
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}

volumes:
  storage:
